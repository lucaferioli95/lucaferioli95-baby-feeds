<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Baby Feeds</title>
<meta name="theme-color" content="#fbf3e8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#fbf3e8;--surface:#fffaf4;--fg:#4a3434;--muted:#9b807a;--line:#efdcd0;--accent:#d98a85;--accent-fg:#fff;--ok:#7aa38a;--deep:#8c5a5a}
:root{color-scheme:light}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
main{max-width:480px;margin:0 auto;padding:12px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
h1{font-size:18px;margin:0}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-size:14px;padding:4px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:12px 0;font:inherit;font-weight:600;color:var(--muted)}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
.round{display:block;width:170px;height:170px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);font-size:64px;margin:18px auto 10px;box-shadow:0 8px 24px rgba(217,138,133,.4)}
.round:active{transform:scale(.97)}
.qsheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.qsheet input[type=time]{font:inherit;font-size:22px;margin-left:8px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:#fff;color:var(--fg)}
.qchips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.qrow{display:flex;gap:10px}.qrow .btn{margin-top:6px}.btn.alt{max-width:70px}.btn.alt{background:var(--line);color:var(--fg);max-width:90px}
.qsince{text-align:center;color:var(--muted);font-size:14px;margin-top:14px;min-height:18px}
.qcard{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:10px 14px;margin:6px 0;font:inherit;color:var(--fg);text-align:left}
.qt{font-weight:700;font-size:18px;min-width:56px}
.qd{flex:1;position:relative;color:var(--deep);font-size:14px;padding:4px 8px;border-radius:8px;overflow:hidden}
.qbar{position:absolute;left:0;top:0;bottom:0;background:var(--line);z-index:0;border-radius:8px}
.qdt{position:relative;z-index:1}.qe{color:var(--muted)}
#qOld .dayd{margin:6px 0}
.qsum{text-align:center;font-weight:700;font-size:18px;margin:8px 0}
.big{display:block;width:100%;border:0;border-radius:20px;background:var(--accent);color:var(--accent-fg);font:inherit;font-size:22px;font-weight:700;padding:34px 0;margin:10px 0}
.big.stop{background:var(--deep);color:#fff}
.clock{text-align:center;font-size:56px;font-weight:300;font-variant-numeric:tabular-nums;margin:18px 0 0}
.sub{text-align:center;color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input{width:100%;font:inherit;font-size:18px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.row{display:flex;gap:10px}.row>*{flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:20px;padding:8px 14px;font:inherit}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--accent);color:var(--accent-fg);font:inherit;font-weight:700;padding:14px;margin-top:14px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--fg)}
.btn.del{background:none;color:#b5524f;border:1px solid var(--line)}
.dayd{margin:8px 0}.dayd[open]{margin-bottom:14px}
.day{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-weight:700;cursor:pointer;list-style:none}
.day::-webkit-details-marker{display:none}.day .dl::before{content:'\25B8';display:inline-block;margin-right:8px;color:var(--accent);transition:transform .15s}.dayd[open] .day .dl::before{transform:rotate(90deg)}
.day span{font-weight:400;font-size:13px;color:var(--muted)}
.item{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--surface);color:inherit;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:6px 0;font:inherit}
.item b{font-variant-numeric:tabular-nums}.item small{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}.foot a{color:inherit}
.switch{display:flex;gap:10px;align-items:center;margin:0;font-size:16px;color:var(--fg)}.switch input{width:20px;height:20px}
.dia{display:flex;gap:10px;margin:10px 0}
.dbox{flex:1;display:flex;border:1px solid var(--line);background:var(--surface);border-radius:16px;overflow:hidden}
.dadd{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;border:0;background:none;color:var(--fg);font:inherit;padding:16px 0}
.dadd .dic{font-size:30px}.dadd b{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.dadd:active{background:var(--bg)}
.dminus{width:44px;border:0;border-right:1px solid var(--line);background:none;color:var(--muted);font:inherit;font-size:22px}
.bang{color:#fff;background:#d33;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;font-size:12px;margin-right:6px;vertical-align:middle}
.dashhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:20px;overflow:hidden}.seg button{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;padding:5px 12px}.seg button.on{background:var(--accent);color:var(--accent-fg)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}.tile span{font-size:12px;color:var(--muted)}
.gate{max-width:420px;margin:60px auto;padding:24px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px}.gate p{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--deep);color:#fff;padding:10px 16px;border-radius:10px;z-index:9}
</style>
</head>
<body>
<div class="gate" id="gate" hidden></div>
<main id="app">
  <header><h1>Baby Feeds</h1><button type="button" class="linkbtn" id="installBtn">Install app</button></header>

  <section id="quick">
    <div class="qsince" id="qSince"></div>
    <button type="button" class="round" id="qBtn" aria-label="Feed">🐝</button>
    <div id="qSheet" class="qsheet" hidden>
      <label class="sub">Start <input type="time" id="qTime"></label>
      <div class="sub">Breast</div>
      <div class="qchips" id="qSides"><button type="button" class="chip" data-s="L">L</button><button type="button" class="chip" data-s="R">R</button></div>
      <div class="sub">Duration</div>
      <div class="qchips" id="qChips"></div>
      <div class="qrow"><button type="button" class="btn" id="qSave">✓</button><button type="button" class="btn alt" id="qCancel">✕</button><button type="button" class="btn alt" id="qDel" hidden>🗑</button></div>
    </div>
    <div id="qToday"></div>
    <details class="dayd" id="qOldWrap"><summary class="day"><span class="dl">Earlier</span></summary><div id="qOld"></div></details>
  </section>

  <section id="live" hidden style="display:none">
    <div class="sub" id="lastFeed"></div>
    <div class="clock" id="clock" hidden>00:00</div>
    <div class="sub" id="startedAt" hidden></div>
    <button class="big" id="startBtn" type="button">▶ Start</button>
    <div class="card" id="stopCard" hidden>
      <div class="chips sides" id="liveSides"></div>
      <label for="liveMl">🥛 ml</label>
      <input id="liveMl" type="number" inputmode="decimal" min="0" step="0.1" placeholder="0">
      <div class="chips" data-for="liveMl"></div>
      <button class="big stop" id="stopBtn" type="button" style="font-size:20px;padding:20px 0">■ Stop</button>
      <button class="btn ghost" id="cancelBtn" type="button">✕</button>
    </div>
    <div class="dia" id="dia">
      <div class="dbox"><button type="button" class="dminus" data-k="pee" aria-label="Remove one pee">−</button><button type="button" class="dadd" data-k="pee" aria-label="Add pee"><span class="dic">💧</span><b id="cPee">0</b></button></div>
      <div class="dbox"><button type="button" class="dminus" data-k="poop" aria-label="Remove one poop">−</button><button type="button" class="dadd" data-k="poop" aria-label="Add poop"><span class="dic">💩</span><b id="cPoop">0</b></button></div>
    </div>
    <div class="card" id="dash">
      <div class="dashhead"><b>📊</b><span class="seg"><button type="button" data-m="day" class="on">Today</button><button type="button" data-m="24h">24 h</button></span></div>
      <div class="tiles" id="tiles"></div>
      <div class="sub" id="typical" style="margin-top:10px"></div>
    </div>
    <div class="card" id="remCard">
      <label class="switch"><input type="checkbox" id="remOn"> 🔔 Next feed</label>
      <div id="remOpts" hidden>
        <div class="row" style="align-items:end"><div><label for="remT">🔔 at</label><input id="remT" type="time"></div>
        <div style="flex:0 0 auto"><button class="btn ghost" id="rem3" type="button" style="margin:0;padding:10px 14px">+3 h</button></div></div>
        <button class="linkbtn" id="remTest" type="button" style="margin-top:8px;padding-left:0">Test 🔔</button>
        <div class="sub" id="remNext" style="text-align:left;margin-top:8px"></div>
      </div>
      <div class="sub" id="remMsg" style="text-align:left"></div>
    </div>
  </section>

  <section id="add" hidden style="display:none">
    <div class="card">
      <h2 id="formTitle" style="margin:0;font-size:16px">🍼 ＋</h2>
      <label for="fDate">Date</label><input id="fDate" type="date">
      <div class="row">
        <div><label for="fStart">Start</label><input id="fStart" type="time"></div>
        <div><label for="fEnd">End</label><input id="fEnd" type="time"></div>
      </div>
      <div class="chips sides" id="fSides"></div>
      <label for="fMl">🥛 ml</label>
      <input id="fMl" type="number" inputmode="decimal" min="0" step="0.1" placeholder="0">
      <div class="chips" data-for="fMl"></div>
      <button class="btn" id="saveBtn" type="button">✓</button>
      <button class="btn del" id="delBtn" type="button" hidden>🗑</button>
      <button class="btn ghost" id="cancelEdit" type="button" hidden>✕</button>
    </div>
  </section>

  <section id="hist" hidden style="display:none">
    <div id="histList"></div>
    <button class="btn ghost" id="exportBtn" type="button">⬇ CSV</button>
  </section>

  <p class="foot">Version <span id="ver"></span> · <a href="https://github.com/lucaferioli95/lucaferioli95-baby-feeds/blob/main/CHANGELOG.md">Changelog</a> · <span id="hostNote"></span><br><span id="syncUi">Data is also kept on this device.</span></p>
</main>
<script src="supabase.js"></script>
<script src="install.js"></script>
<script>
var APP_VERSION = '2.5.0';
var KEY = 'bf-feeds-v1', LIVE = 'bf-live-v1';
function $(id){ return document.getElementById(id); }
function load(k, d){ try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){ toast('Could not save on this device'); } }
var store = load(KEY, []);       // {id, s, e (ms), ml, side, t (last change), del (removed)}
store.forEach(function(f){ if (!f.t) f.t = f.s; });
var feeds = store.filter(function(f){ return !f.del; });
var live = load(LIVE, null);     // {s} while a feed is running
var editing = null;
var liveSide = '', formSide = '';
$('ver').textContent = APP_VERSION;

function pad(n){ return (n < 10 ? '0' : '') + n; }
function dstr(ms){ var d = new Date(ms); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function tstr(ms){ var d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function dur(ms){ var m = Math.round(ms / 60000); return m < 60 ? m + ' min' : Math.floor(m/60) + ' h ' + pad(m % 60) + ' min'; }
function dayLabel(key){
  var t = dstr(Date.now()), y = dstr(Date.now() - 864e5);
  if (key === t) return 'Today'; if (key === y) return 'Yesterday';
  var p = key.split('-'); return new Date(p[0], p[1]-1, p[2]).toLocaleDateString(undefined, {weekday:'short', day:'numeric', month:'short', year:'numeric'});
}
function toast(m){ var t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 1800); }
function mlv(v){ var n = parseFloat(String(v).replace(',', '.')); return isFinite(n) && n > 0 ? Math.round(n * 10) / 10 : 0; }
function fm(n){ return String(Math.round(n * 10) / 10); }
// Nappies: one small record per tap, so two phones tapping at once never lose a count
var dstore = load('bf-dia-v1', []);   // {id, day, k: 'pee' | 'poop', t, del}
function dcount(day, k){ return dstore.filter(function(x){ return x.day === day && x.k === k && !x.del; }).length; }
function renderDia(){ var d = dstr(Date.now()); $('cPee').textContent = dcount(d, 'pee'); $('cPoop').textContent = dcount(d, 'poop'); }
function dCommit(push){ save('bf-dia-v1', dstore); renderDia(); if (!$('hist').hidden) renderHist(); if (push !== false) syncSoon(); }
document.querySelectorAll('.dadd').forEach(function(b){ b.onclick = function(){
  dstore.push({id: newId(), day: dstr(Date.now()), k: b.dataset.k, t: Date.now()}); dCommit();
  try { navigator.vibrate && navigator.vibrate(15); } catch(e){}
}; });
document.querySelectorAll('.dminus').forEach(function(b){ b.onclick = function(){
  var d = dstr(Date.now()), l = dstore.filter(function(x){ return x.day === d && x.k === b.dataset.k && !x.del; }).sort(function(a, c){ return c.t - a.t; })[0];
  if (l){ l.del = true; l.t = Date.now(); dCommit(); }
}; });
// A feed can be saved with gaps. miss holds 's' (no start) and/or 'e' (no end); no breast also counts as incomplete.
function noS(f){ return (f.miss || '').indexOf('s') >= 0; }
function noE(f){ return /[en]/.test(f.miss || ''); }
function qk(f){ return (f.miss || '').indexOf('q') >= 0; }
function incomplete(f){ return noS(f) || (f.miss || '').indexOf('e') >= 0 || (!f.side && !qk(f)); }
function whole(f){ return !noS(f) && !noE(f); }
function qNo(f){ return (f.miss || '').indexOf('n') >= 0; }
function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
// Save locally, refresh the screen and (when signed in) sync with the other phone
function commit(push){
  save(KEY, store); feeds = store.filter(function(f){ return !f.del; });
  renderLive(); remRender(); if (!$('hist').hidden) renderHist(); if (!$('quick').hidden) renderQuick();
  if (push !== false) syncSoon();
}
function toMs(date, time){ var d = date.split('-'), t = time.split(':'); return new Date(+d[0], +d[1]-1, +d[2], +t[0], +t[1]).getTime(); }

/* tabs */
function tab(name){
  ['quick','live','add','hist'].forEach(function(t){ $(t).hidden = t !== name; });
  document.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('on', b.dataset.tab === name); });
  if (name === 'hist') renderHist();
  if (name === 'quick') renderQuick();
  if (name === 'add' && editing === null) resetForm();
}
document.querySelectorAll('.tab').forEach(function(b){ b.onclick = function(){ if (b.dataset.tab !== 'add') editing = null; tab(b.dataset.tab); }; });

/* breast side: tap Left, Right or both */
function sideChips(box, get, set){
  box.innerHTML = '';
  [['L','L'],['R','R']].forEach(function(x){
    var b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = x[1]; b.dataset.k = x[0];
    b.onclick = function(){ var v = get(); v = v.indexOf(x[0]) >= 0 ? v.replace(x[0], '') : (v + x[0]).split('').sort().reverse().join(''); set(v); paintSides(); };
    box.appendChild(b);
  });
}
function paintSides(){
  [['liveSides', liveSide], ['fSides', formSide]].forEach(function(p){
    $(p[0]).querySelectorAll('.chip').forEach(function(b){ b.classList.toggle('on', p[1].indexOf(b.dataset.k) >= 0); });
  });
}
function sideTxt(v){ return v === 'LR' || v === 'RL' ? 'L+R' : v; }
sideChips($('liveSides'), function(){ return liveSide; }, function(v){ liveSide = v; if (live){ live.side = v; save(LIVE, live); } });
sideChips($('fSides'), function(){ return formSide; }, function(v){ formSide = v; });

/* chips */
[1,3].forEach(function(n){
  document.querySelectorAll('.chips:not(.sides)').forEach(function(c){
    var b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = n; b.onclick = function(){ $(c.dataset.for).value = n; };
    c.appendChild(b);
  });
});

/* live */
var timer = null;
function renderLive(){
  var run = !!live;
  $('startBtn').hidden = run; $('stopCard').hidden = !run; $('clock').hidden = !run; $('startedAt').hidden = !run;
  if (run){ liveSide = live.side || ''; paintSides(); $('startedAt').textContent = 'Started ' + tstr(live.s); tick(); if (!timer) timer = setInterval(tick, 1000); }
  else { clearInterval(timer); timer = null; }
  var timedFeeds = feeds.filter(function(f){ return !noS(f); }), last = timedFeeds.length ? timedFeeds.reduce(function(a,b){ return b.s > a.s ? b : a; }) : null;
  renderDash(); renderDia();
  $('lastFeed').textContent = last ? '🍼 ' + dur(Date.now() - last.s) + ' ago · ' + tstr(last.s) : '🍼 –';
}
var dmode = 'day'; try { dmode = localStorage.getItem('bf-dmode') || 'day'; } catch(e){}
function mins(ms){ var m = Math.round(ms / 60000); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + pad(m % 60) + 'm'; }
function renderDash(){
  document.querySelectorAll('#dash .seg button').forEach(function(b){ b.classList.toggle('on', b.dataset.m === dmode); });
  var now = Date.now(), d0 = new Date(); d0.setHours(0, 0, 0, 0);
  var from = dmode === 'day' ? d0.getTime() : now - 864e5, len = now - from;
  var inR = function(a, b){ return feeds.filter(function(f){ return f.s >= a && f.s < b; }).sort(function(x, y){ return x.s - y.s; }); };
  var cur = inR(from, now + 1), prev = inR(from - len, from);
  var tm = cur.reduce(function(a, f){ return a + (whole(f) ? f.e - f.s : 0); }, 0), ml = cur.reduce(function(a, f){ return a + (f.ml || 0); }, 0);
  var gaps = [], timed = cur.filter(function(f){ return !noS(f); }); for (var i = 1; i < timed.length; i++) gaps.push(timed[i].s - timed[i-1].s);
  var avg = gaps.length ? gaps.reduce(function(a, g){ return a + g; }, 0) / gaps.length : 0, longest = gaps.length ? Math.max.apply(null, gaps) : 0;
  var all = feeds.filter(function(f){ return !noS(f); }).sort(function(a, b){ return b.s - a.s; }), last = all[0];
  var next = !last || !last.side ? '–' : last.side === 'L' ? 'R' : last.side === 'R' ? 'L' : '–';
  var cnt = function(k){ return cur.filter(function(f){ return (f.side || '').indexOf(k) >= 0; }).length; };
  var cmp = dmode === 'day' ? 'yesterday' : 'before';
  var T = [
    [cur.length, '🍼 · ' + (dmode === 'day' ? '↩' : '⟲') + ' ' + prev.length],
    [cur.length ? mins(tm) : '–', '⏱ breast'],
    [ml ? fm(ml) + ' ml' : '–', '🥛'],
    [gaps.length ? mins(avg) : '–', '↔ avg'],
    [gaps.length ? mins(longest) : '–', '↔ max'],
    [next, '➜ next · L' + cnt('L') + ' R' + cnt('R')]
  ];
  $('tiles').innerHTML = T.map(function(t){ return '<div class="tile"><b>' + t[0] + '</b><span>' + t[1] + '</span></div>'; }).join('');
  // a typical day from the last 7 days that have feeds (today left out)
  var by = {}; feeds.filter(function(f){ return f.s >= d0.getTime() - 7 * 864e5 && f.s < d0.getTime(); }).forEach(function(f){ var k = dstr(f.s); by[k] = by[k] || {n: 0, ml: 0}; by[k].n++; by[k].ml += f.ml || 0; });
  var ks = Object.keys(by);
  $('typical').textContent = ks.length ? 'Ø ' + ks.length + ' d: ' + Math.round(ks.reduce(function(a, k){ return a + by[k].n; }, 0) / ks.length * 10) / 10 + ' 🍼 · ' + fm(ks.reduce(function(a, k){ return a + by[k].ml; }, 0) / ks.length) + ' ml' : '';
}
document.querySelectorAll('#dash .seg button').forEach(function(b){ b.onclick = function(){ dmode = b.dataset.m; try { localStorage.setItem('bf-dmode', dmode); } catch(e){} renderDash(); }; });

/* add / edit */
function resetForm(){

$('saveBtn').onclick = function(){
  var date = $('fDate').value, st = $('fStart').value, en = $('fEnd').value;
  if (!date){ date = dstr(Date.now()); $('fDate').value = date; }
  var miss = (st ? '' : 's') + (en ? '' : 'e');
  // a missing time is stored as midnight (start) or the start (end) so the feed still sorts under its day
  var s = toMs(date, st || '00:00'), e = en ? toMs(date, en) : s;
  if (st && en && e < s) e += 864e5;           // finished after midnight
  if (st && en && e - s > 6 * 3600e3){ toast('> 6 h ?'); return; }
  var ml = mlv($('fMl').value);
  if (editing){ var f = store.find(function(x){ return x.id === editing; }); if (f){ f.s = s; f.e = e; f.ml = ml; f.side = formSide; f.miss = miss; f.t = Date.now(); } }
  else store.push({id: newId(), s: s, e: e, ml: ml, side: formSide, miss: miss, t: Date.now()});
  commit(); editing = null; toast('Saved'); resetForm(); tab('hist'); schedule();
};
$('delBtn').onclick = function(){ if (editing && confirm('Delete this feed?')){ var f = store.find(function(x){ return x.id === editing; }); if (f){ f.del = true; f.t = Date.now(); } commit(); editing = null; tab('hist'); schedule(); } };

/* quick tab: one round button */
var qDur = 0, qSide = '', qEditing = null, qDurMs = 0;

var qLastMs = 0;

function renderQuick(){

function qPaint(){
  document.querySelectorAll('#qChips .chip').forEach(function(c){ c.classList.toggle('on', +c.dataset.m * 60000 === qDurMs); });

$('qChips').onclick = function(e){ var b = e.target.closest('.chip'); if (!b) return; var v = +b.dataset.m * 60000; qDurMs = qDurMs === v ? 0 : v; qPaint(); };
$('qSides').onclick = function(e){ var b = e.target.closest('.chip'); if (!b) return; var x = b.dataset.s; qSide = (qSide.indexOf(x) >= 0 ? qSide.replace(x, '') : qSide + x).split('').sort(function(p, q){ return p === 'L' ? -1 : 1; }).join(''); qPaint(); };

$('qCancel').onclick = qClose;
$('qDel').onclick = function(){

$('qSave').onclick = function(){

  var day = f ? dstr(f.s) : dstr(Date.now());

  var miss = 'q' + (qDurMs ? '' : 'n');

/* history */
var openDays = {};   // days the user opened or closed by hand; today is open unless closed
function renderHist(){
  var days = {};
  feeds.slice().sort(function(a,b){ return b.s - a.s; }).forEach(function(f){ (days[dstr(f.s)] = days[dstr(f.s)] || []).push(f); });
  dstore.forEach(function(x){ if (!x.del && !days[x.day]) days[x.day] = []; });
  if (!Object.keys(days).length){ $('histList').innerHTML = '<div class="empty">🍼 –</div>'; return; }
  $('histList').innerHTML = Object.keys(days).sort().reverse().map(function(k){
    var L = days[k], mins = L.reduce(function(a,f){ return a + (whole(f) ? (f.e - f.s) / 60000 : 0); }, 0), ml = L.reduce(function(a,f){ return a + (f.ml || 0); }, 0);
    var isOpen = k in openDays ? openDays[k] : k === dstr(Date.now());
    return '<details class="dayd" data-k="' + k + '"' + (isOpen ? ' open' : '') + '><summary class="day"><span class="dl">' + dayLabel(k) + '</span><span>' + (L.some(incomplete) ? '<b class="bang">!</b> ' : '') + '🍼' + L.length + ' · ' + Math.round(mins) + '′' + (ml ? ' · 🥛' + fm(ml) : '') + ' · 💧' + dcount(k, 'pee') + ' 💩' + dcount(k, 'poop') + '</span></summary>' +
      L.map(function(f){ return '<button class="item" data-id="' + f.id + '"><span>' + (incomplete(f) ? '<b class="bang" title="Something is missing">!</b>' : '') + '<b>' + (noS(f) ? '–:–' : tstr(f.s)) + (qNo(f) ? '' : '–' + (noE(f) ? '–:–' : tstr(f.e))) + '</b> <small>' + (whole(f) ? dur(f.e - f.s) : '') + (f.side ? ' · ' + sideTxt(f.side) : '') + '</small></span><span>' + (f.ml ? '+' + fm(f.ml) + ' ml' : '') + '</span></button>'; }).join('') + '</details>';

$('histList').addEventListener('toggle', function(e){ var d = e.target; if (d.dataset && d.dataset.k) openDays[d.dataset.k] = d.open; }, true);
$('histList').onclick = function(e){ var b = e.target.closest('.item'); if (b) edit(b.dataset.id); };
$('exportBtn').onclick = function(){
  var rows = ['Date,Start,End,Minutes,Breast,TopUp_ml'].concat(feeds.slice().sort(function(a,b){ return a.s - b.s; }).map(function(f){ return [dstr(f.s), noS(f) ? '' : tstr(f.s), noE(f) ? '' : tstr(f.e), whole(f) ? Math.round((f.e - f.s)/60000) : '', sideTxt(f.side || ''), f.ml || 0].join(','); }));

/* next-feed notification (web push, sent by a small server job so it arrives with the app closed) */
var PUSH_URL = 'https://jsddqdmaatosqvbdrzjo.supabase.co/functions/v1/bf-push';
var VAPID = 'BA_-09UuzUtJEbYBt3t64pXyFOqGa7AnXgXFkZ2o5dMZFPKVm5Y_2qiWj0QGv29y5LmaJFBVb1aN2BvZpLeVnTA';
var rem = load('bf-rem-v1', {on: false, h: 3, sub: null, manual: null});
rem.h = 3;
function remSave(){ save('bf-rem-v1', rem); }
function b64(s){ var p = '='.repeat((4 - s.length % 4) % 4), r = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(r, function(c){ return c.charCodeAt(0); }); }
function post(o){ return fetch(PUSH_URL, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(o)}).then(function(r){ return r.json(); }); }
function pushOk(){ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
// A time picked by hand wins until it has passed or a new feed starts; otherwise 3 h after the latest feed began.
function nextDue(){
  if (rem.manual && rem.manual > Date.now()) return rem.manual;
  var last = feeds.reduce(function(a, f){ return noS(f) ? a : Math.max(a, f.s); }, 0);
  if (live) last = Math.max(last, live.s);
  return last ? last + rem.h * 3600e3 : 0;
}
function remRender(){
  $('remOn').checked = rem.on; $('remOpts').hidden = !rem.on;
  var d = nextDue(), live_ = d > Date.now();
  if (document.activeElement !== $('remT')) $('remT').value = live_ ? tstr(d) : '';
  $('remNext').textContent = rem.on && live_ ? 'Reminder ' + (dstr(d) === dstr(Date.now()) ? 'today' : 'tomorrow') + ' at ' + tstr(d) : (rem.on ? 'No reminder set. Pick a time or tap In 3 h.' : '');
}
function schedule(){
  remRender();
  if (!rem.on || !rem.sub) return;
  var d = nextDue();
  if (d > Date.now()) post({action: 'set', sub: rem.sub, dueAt: new Date(d).toISOString(), title: 'Next feed', body: 'Time for the next feed.'}).catch(function(){ $('remMsg').textContent = 'Could not reach the reminder service (offline?).'; });
  else post({action: 'cancel', endpoint: rem.sub.endpoint}).catch(function(){});
}
function enableRem(){
  $('remMsg').textContent = '';
  if (!pushOk()){ $('remMsg').textContent = 'This browser cannot do notifications. On iPhone, add the app to the Home Screen first.'; return Promise.resolve(false); }
  return Notification.requestPermission().then(function(p){
    if (p !== 'granted'){ $('remMsg').textContent = 'Notifications are blocked. Allow them for this app in the phone or browser settings.'; return false; }
    return navigator.serviceWorker.ready.then(function(reg){
      return reg.pushManager.getSubscription().then(function(sub){ return sub || reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64(VAPID)}); });
    }).then(function(sub){ rem.sub = JSON.parse(JSON.stringify(sub)); rem.on = true; remSave(); schedule(); return true; });
  }).catch(function(e){ $('remMsg').textContent = 'Could not turn on notifications (' + (e && e.message || e) + ')'; return false; });
}
$('remOn').onchange = function(){
  if (this.checked){ enableRem().then(function(ok){ if (!ok){ rem.on = false; remSave(); } remRender(); }); }
  else { rem.on = false; remSave(); if (rem.sub) post({action: 'cancel', endpoint: rem.sub.endpoint}).catch(function(){}); remRender(); }
};
// A clock time that has already passed today means that time tomorrow, so it rolls over midnight.
$('remT').onchange = function(){
  if (!this.value) return;
  var t = this.value.split(':'), d = new Date(); d.setHours(+t[0], +t[1], 0, 0);
  if (d.getTime() <= Date.now()) d.setDate(d.getDate() + 1);
  rem.manual = d.getTime(); remSave(); this.blur(); schedule();
};
$('rem3').onclick = function(){ rem.manual = Date.now() + 3 * 3600e3; remSave(); schedule(); };
$('remTest').onclick = function(){ if (!rem.sub) return; $('remMsg').textContent = 'Sending…'; post({action: 'test', sub: rem.sub}).then(function(r){ $('remMsg').textContent = r.ok ? 'Sent, it should appear in a few seconds.' : 'Failed (' + (r.error || 'unknown') + ').'; }).catch(function(){ $('remMsg').textContent = 'Could not reach the reminder service.'; }); };

function syncSoon(){ if (!sb || !sess) return; clearTimeout(syncTmr); syncTmr = setTimeout(sync, 400); }

      else if (Number(x.t) > (f.t || 0)){ f.s = Number(x.s); f.e = Number(x.e); f.ml = Number(x.ml) || 0; f.side = x.side; f.miss = x.miss || ''; f.t = Number(x.t); f.del = x.deleted; changed = true; }

    dr.data.forEach(function(x){

      else if (Number(x.t) > (f.t || 0)){ f.t = Number(x.t); f.del = x.deleted; dchanged = true; }
    });
    dstore.forEach(function(f){ var x = dremote[f.id]; if (!x || (f.t || 0) > Number(x.t)) dup.push({id: f.id, day: f.day, kind: f.k, t: f.t, deleted: !!f.del}); });

async function boot(){
